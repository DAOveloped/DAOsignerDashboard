<!-- DAOsigner Banner — Single SVG, EXACT watermark via base64 PNG, 1500x300 -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1500"
  height="300"
  viewBox="0 0 1500 300"
  role="img"
  aria-label="CREATE ONCE. EARN FOREVER."
>
  <defs>
    <!-- Prism Ember gradient -->
    <linearGradient id="prism-ember" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="35%" stop-color="#FF8966" />
      <stop offset="70%" stop-color="#FF4F81" />
      <stop offset="100%" stop-color="#D13FFF" />
    </linearGradient>

    <style>
      .t1 {
        fill: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: 0.02em;
      }
      .t2 {
        fill: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.18em;
      }
    </style>
  </defs>

  <!-- Gradient background -->
  <rect width="1500" height="300" fill="url(#prism-ember)" />

  <!-- EXACT watermark: embedded PNG as base64, centered & subtle -->
  <!-- Tweak opacity to 0.05–0.15 to taste. Scale to change size. -->
  <g opacity="0.09" transform="translate(750,150) scale(1.15)">
    <!-- We’ll center by drawing a 1000x1000 box around (0,0) -->
    <image
      xlink:href="data:image/png;base64,REPLACE_WITH_BASE64"
      x="-500"
      y="-500"
      width="1000"
      height="1000"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>

  <!-- Copy (centered) -->
  <g text-anchor="middle">
    <text class="t1" x="750" y="148">CREATE ONCE. EARN FOREVER.</text>
    <text class="t2" x="750" y="198">DESIGN • EARN • REPEAT</text>
  </g>
</svg>
